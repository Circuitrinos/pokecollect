# Build PokéCollect images on every push to the `english` branch and publish
# them to GitHub Container Registry:
#   ghcr.io/<owner>/pokecollect-{api,web,matcher}:latest     (moves with the branch)
#   ghcr.io/<owner>/pokecollect-{api,web,matcher}:sha-<sha>  (fixed, for rollbacks)
# Save as .github/workflows/images.yml in the fork.
name: images

on:
  push:
    branches: [english]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# A newer push replaces a build that is still queued or running (:latest only
# needs the newest commit), so one stuck run can't hold up the next.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Without a limit a hung build runs for 6 hours. A normal build takes a few minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: web
          - name: matcher
            context: matcher
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case owner (GHCR requires it)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pokecollect-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/pokecollect-${{ matrix.name }}:sha-${{ github.sha }}
          # Only the web image uses these (baked in at build time); the others ignore them.
          # Empty API URL = relative /api calls through the gateway; currency = your choice.
          # Links the package to this repository (so Actions keeps write access).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_CURRENCY=USD
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
